<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    input, button { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
    button { background: #ff9900; border: none; font-weight: bold; cursor: pointer; }
    #msg { font-weight: bold; }
  </style>
</head>
<body>
  <h2>Registration Form</h2>

  <form id="regForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="tel" id="phone" placeholder="Phone" required>
    <input type="text" id="course" placeholder="Course" required>
    <button type="submit">Register</button>
  </form>

  <p id="msg"></p>

  <script>
    const API_URL = "https://tnlyt4gk0m.execute-api.ap-southeast-2.amazonaws.com/register";

    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "Submitting...";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        course: document.getElementById("course").value
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        msg.textContent = result.message || result.error;
        console.log("Status:", res.status, "URL:", API_URL, result);
        if (res.ok) e.target.reset();
      } catch (err) {
        msg.textContent = "Network error: " + err.message;
        console.error(err);
      }
    });
  </script>
</body>
</html>
